<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Click Counter - Collective Absurdity</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent: #58a6ff;
            --success: #238636;
            --success-hover: #2ea043;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p.subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 30px;
        }
        .counter-box {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 48px;
            font-weight: bold;
            color: var(--accent);
            margin: 20px 0;
            letter-spacing: -1px;
        }
        .pulse-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(35, 134, 54, 0.7);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(35, 134, 54, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(35, 134, 54, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(35, 134, 54, 0); }
        }
        .click-btn {
            background-color: var(--success);
            color: white;
            border: 1px solid rgba(240,246,252,0.1);
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }
        .click-btn:hover { background-color: var(--success-hover); }
        .click-btn:active { transform: scale(0.98); }
        .github-badge {
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        .github-badge p { font-size: 12px; color: #8b949e; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Global Click Counter</h1>
        <p class="subtitle">An internet-wide collective experiment</p>
        
        <div class="pulse-container">
            <div class="pulse-dot"></div>
            <span>Live World Data</span>
        </div>

        <div class="counter-box" id="global-counter">Loading...</div>

        <button class="click-btn" id="click-trigger">CLICK TO INCREMENT</button>

        <div class="github-badge">
            <p>Live SVG GitHub Embed preview:</p>
            <!-- Carrega dinamicamente o mesmo SVG que vai pro GitHub -->
            <img id="svg-preview" src="/api/counter" alt="GitHub Live Badge" style="max-width: 100%;">
        </div>
    </div>

    <script>
        const counterEl = document.getElementById('global-counter');
        const buttonEl = document.getElementById('click-trigger');
        const svgPreview = document.getElementById('svg-preview');

        // Polling de alta velocidade (Tempo Real adaptado para Serverless)
        async function fetchLiveCount() {
            try {
                // Força o navegador a pular o cache na requisição do site
                const res = await fetch(`/api/counter?t=${Date.now()}`);
                if (res.ok) {
                    // Extrai o número de cliques diretamente do código SVG gerado pela API
                    const svgText = await res.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(svgText, "image/svg+xml");
                    const countText = doc.querySelector('.count').textContent;
                    counterEl.textContent = countText;
                }
            } catch (err) {
                console.error("Failed to fetch live score", err);
            }
        }

        // Evento de Clique no Site (Sincronizado via API)
        buttonEl.addEventListener('click', async () => {
            // Feedback visual imediato (Optimistic UI update)
            const currentNum = parseInt(counterEl.textContent.replace(/,/g, '')) || 0;
            counterEl.textContent = (currentNum + 1).toLocaleString('en-US');

            try {
                // Envia requisição em segundo plano informando que veio da Web
                await fetch(`/api/click?source=web&t=${Date.now()}`);
                // Atualiza o preview do SVG
                svgPreview.src = `/api/counter?t=${Date.now()}`;
            } catch (err) {
                console.error("Click dropped by network", err);
            }
        });

        // Loop de atualização a cada 2.5 segundos (Equilíbrio de cota da Vercel)
        setInterval(fetchLiveCount, 2500);
        fetchLiveCount();
    </script>
</body>
</html>
